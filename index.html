<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Budget">
<title>Budget 2026</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  background: #0a0f1e; color: #e2e8f0; font-family: Georgia, serif;
  min-height: 100vh;
  padding: env(safe-area-inset-top, 20px) 16px env(safe-area-inset-bottom, 24px);
}
.wrap { max-width: 680px; margin: 0 auto; padding-top: 16px; }
.eyebrow { font-size: 11px; letter-spacing: 0.2em; color: #64748b; text-transform: uppercase; margin-bottom: 4px; }
h1 { font-size: 26px; font-weight: 700; color: #f1f5f9; letter-spacing: -0.5px; }
h2 { font-size: 18px; color: #f1f5f9; font-weight: 700; }

/* Header */
.header-row { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.income-label { color: #4ade80; font-size: 14px; margin-top: 4px; }
.wedding-box { text-align: right; }
.wedding-count { font-size: 26px; font-weight: 700; color: #fb923c; }
.wedding-sub { font-size: 12px; color: #94a3b8; }

/* Stats bar */
.stats-bar { margin-bottom: 20px; padding: 12px 16px; background: linear-gradient(135deg,#1e293b,#0f172a); border-radius: 10px; border: 1px solid #334155; display: flex; gap: 20px; flex-wrap: wrap; }
.stat-label { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 0.1em; }
.stat-val { font-size: 17px; font-weight: 700; }
.stat-sub { font-size: 11px; color: #64748b; }

/* Tabs */
.tabs { display: flex; gap: 3px; background: #1e293b; border-radius: 10px; padding: 4px; margin-bottom: 20px; flex-wrap: wrap; }
.tab { flex: 1; padding: 8px 4px; border-radius: 8px; border: none; cursor: pointer; font-size: 12px; font-weight: 600; font-family: inherit; background: transparent; color: #64748b; transition: all 0.2s; min-width: 60px; }
.tab.active { background: #334155; color: #f1f5f9; }

.section-label { font-size: 11px; letter-spacing: 0.15em; color: #64748b; text-transform: uppercase; margin-bottom: 10px; margin-top: 20px; }

/* Fixed rows */
.row-fixed { display: flex; align-items: center; padding: 10px 14px; margin-bottom: 6px; background: #1e293b; border-radius: 8px; border: 1px solid #2d3748; }
.row-fixed .fn { flex: 1; font-size: 14px; color: #94a3b8; }
.row-fixed .fb { font-size: 13px; color: #64748b; }
.row-fixed .ff { font-size: 12px; color: #4ade80; margin-left: 12px; }

/* Category cards */
.cat-card { margin-bottom: 10px; background: #1e293b; border-radius: 10px; border: 1px solid #2d3748; overflow: hidden; transition: border-color 0.2s; }
.cat-card.over { border-color: #991b1b; }
.cat-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px 8px; }
.cat-name { flex: 1; font-size: 14px; font-weight: 600; color: #e2e8f0; }
.cat-bud { font-size: 12px; color: #64748b; }
.cat-delta { font-size: 12px; font-weight: 700; }
.cat-prog-row { display: flex; align-items: center; gap: 10px; padding: 0 14px 10px; }
.cat-spent { font-size: 13px; color: #94a3b8; white-space: nowrap; }
.prog-wrap { flex: 1; background: #0f172a; border-radius: 4px; height: 6px; overflow: hidden; }
.prog-fill { height: 100%; border-radius: 4px; transition: width 0.3s ease; }
.hint { font-size: 11px; margin: 0 14px 8px; }
.hint.warn { color: #fbbf24; }
.hint.good { color: #4ade80; }

/* Transaction list */
.txn-list { border-top: 1px solid #0f172a; }
.txn-item { display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-top: 1px solid #1a2235; }
.txn-left { flex: 1; min-width: 0; }
.txn-desc { font-size: 13px; color: #e2e8f0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.txn-meta { font-size: 11px; color: #64748b; margin-top: 2px; display: flex; align-items: center; gap: 6px; }
.txn-amt { font-size: 14px; font-weight: 700; color: #f1f5f9; white-space: nowrap; }
.txn-del { background: none; border: none; color: #475569; cursor: pointer; font-size: 20px; padding: 0 2px; line-height: 1; }
.txn-del:active { color: #f87171; }

/* Add form */
.add-form { padding: 10px 14px 12px; border-top: 1px solid #0f172a; background: #0f172a; }
.form-row { display: flex; gap: 8px; margin-bottom: 8px; }
.form-row:last-child { margin-bottom: 0; }
.fi { padding: 8px 10px; background: #1e293b; border: 1px solid #334155; border-radius: 6px; color: #f1f5f9; font-size: 14px; font-family: inherit; outline: none; width: 100%; }
.fi:focus { border-color: #4ade80; }
.fi-dollar-wrap { position: relative; flex: 1; }
.fi-dollar-wrap span { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: #64748b; font-size: 14px; pointer-events: none; }
.fi-dollar { padding-left: 22px !important; }
select.fi { appearance: none; color: #64748b; }
select.fi.chosen { color: #f1f5f9; }
.add-btn { padding: 8px 14px; background: #1e3a2a; border: 1px solid #166534; border-radius: 6px; color: #4ade80; font-size: 13px; font-weight: 700; font-family: inherit; cursor: pointer; white-space: nowrap; }
.add-btn:active { background: #166534; }
.form-err { font-size: 11px; color: #f87171; margin-top: 6px; }

/* Payment badges */
.badge { display: inline-block; padding: 1px 7px; border-radius: 4px; font-size: 10px; font-weight: 700; letter-spacing: 0.05em; }
.b-Chase      { background:#1e3a5f; color:#60a5fa; border:1px solid #1d4ed8; }
.b-ChaseSapphire { background:#0c2d3d; color:#22d3ee; border:1px solid #0e7490; }
.b-Apple      { background:#2d1f3d; color:#c084fc; border:1px solid #7c3aed; }
.b-Amex       { background:#1a3350; color:#7dd3fc; border:1px solid #0369a1; }
.b-Debit      { background:#1a2e1a; color:#86efac; border:1px solid #166534; }
.b-Cash       { background:#2d2a14; color:#fde68a; border:1px solid #92400e; }
.b-Other      { background:#1e293b; color:#94a3b8; border:1px solid #334155; }

/* Summary */
.summary-box { margin-top: 20px; padding: 16px; background: linear-gradient(135deg,#1e293b,#0f172a); border-radius: 10px; border: 1px solid #334155; }
.sum-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; }
.sum-div { height: 1px; background: #334155; margin: 10px 0; }
.sum-total { display: flex; justify-content: space-between; font-size: 16px; font-weight: 700; }
.rem-badge { padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 700; }

/* All-txn tab */
.filter-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
.filter-btn { padding: 5px 12px; border-radius: 20px; border: 1px solid #334155; background: #1e293b; color: #94a3b8; font-size: 12px; font-family: inherit; cursor: pointer; }
.filter-btn.active { background: #334155; color: #f1f5f9; border-color: #4ade80; }
.card-total { margin-bottom: 16px; padding: 12px 16px; background: linear-gradient(135deg,#1e293b,#0f172a); border-radius: 10px; border: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
.all-txn-item { padding: 10px 14px; margin-bottom: 6px; background: #1e293b; border-radius: 8px; border: 1px solid #2d3748; }
.all-txn-top { display: flex; justify-content: space-between; gap: 8px; }
.all-txn-meta { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.empty { text-align: center; padding: 40px; color: #475569; font-size: 13px; line-height: 1.6; }

/* History */
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: right; padding: 8px 6px; font-weight: 600; color: #64748b; }
th:first-child { text-align: left; padding-left: 0; }
td { padding: 8px 6px; border-top: 1px solid #1e293b; text-align: right; }
td:first-child { color: #94a3b8; text-align: left; padding-left: 0; }
tr.tot-row td { border-top: 2px solid #334155; font-weight: 700; padding: 10px 6px; }
.month-bar { margin-bottom: 10px; }
.month-bar-top { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 13px; }
.insight { padding: 10px 14px; border-radius: 8px; font-size: 13px; display: flex; gap: 10px; margin-bottom: 8px; }
.insight.warn { background: #1c1207; border: 1px solid #713f12; color: #fde68a; }
.insight.good { background: #0f1f1a; border: 1px solid #134e35; color: #6ee7b7; }

/* Goals */
.goal-hero { padding: 24px; background: linear-gradient(135deg,#1e293b,#0f172a); border-radius: 14px; border: 1px solid #334155; text-align: center; margin-bottom: 20px; }
.goal-amt { font-size: 40px; font-weight: 700; color: #4ade80; margin-bottom: 4px; }
.goal-div { height: 1px; background: #334155; margin: 16px 0; }
.goal-stats { display: flex; justify-content: center; gap: 40px; }
.proj-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.proj-mo { width: 48px; font-size: 12px; color: #64748b; }
.proj-bar-wrap { flex: 1; background: #1e293b; border-radius: 4px; height: 8px; overflow: hidden; }
.proj-bar-fill { height: 100%; background: #4ade80; border-radius: 4px; }
.proj-amt { width: 72px; text-align: right; font-size: 12px; color: #4ade80; font-weight: 600; }
.adj-card { margin-top: 24px; padding: 16px; background: #1e293b; border-radius: 10px; border: 1px solid #334155; }
.adj-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #0f172a; font-size: 13px; }
.adj-from { color: #94a3b8; font-size: 12px; }
.adj-to { color: #f1f5f9; }
.adj-delta { font-weight: 700; font-size: 12px; }
.footer { margin-top: 32px; text-align: center; font-size: 11px; color: #334155; padding-bottom: 16px; }
.rollover-note { font-size: 11px; color: #fb923c; margin-top: 3px; }

/* Cards tab */
.card-summary { padding: 14px 16px; margin-bottom: 10px; background: #1e293b; border-radius: 10px; border: 1px solid #2d3748; }
.card-summary-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.card-summary-total { font-size: 20px; font-weight: 700; color: #f1f5f9; }
.card-summary-sub { font-size: 11px; color: #64748b; }
.grand-total-box { margin-top: 20px; padding: 14px 16px; background: linear-gradient(135deg,#1e293b,#0f172a); border-radius: 10px; border: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }

/* Reimbursement */
.txn-amt.strike { text-decoration: line-through; color: #64748b; font-weight: 400; font-size: 12px; margin-right: 4px; }
.reimb-row { display:flex; align-items:center; justify-content:space-between; margin-top:4px; }
.b-reimb { background:#0f1f1a; color:#6ee7b7; border:1px solid #134e35; }
.toggle-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #94a3b8; margin-bottom: 8px; }
.toggle-row input { width: 15px; height: 15px; accent-color: #4ade80; }
.reimb-fields { display: none; }
.reimb-fields.show { display: flex; }
.card-sub-line { display:flex; justify-content:space-between; font-size:11px; color:#64748b; margin-top:2px; }
</style>

</head>
<body>
<div class="wrap">

  <div class="header-row">
    <div>
      <div class="eyebrow">Personal Finance</div>
      <h1>Budget Tracker</h1>
      <div class="income-label">Monthly income: <strong>$8,084.13</strong></div>
    </div>
    <div class="wedding-box">
      <div class="eyebrow">Wedding countdown</div>
      <div class="wedding-count" id="weddingMonths">—</div>
      <div class="wedding-sub">months away</div>
    </div>
  </div>

  <div class="stats-bar">
    <div>
      <div class="stat-label">Monthly Budget</div>
      <div class="stat-val" id="statBudget">—</div>
      <div class="stat-sub">total planned</div>
    </div>
    <div>
      <div class="stat-label">Avg Savings/mo</div>
      <div class="stat-val" id="statSavings">—</div>
      <div class="stat-sub">rolling avg</div>
    </div>
    <div>
      <div class="stat-label">Avg Food Spend</div>
      <div class="stat-val" id="statFood">—</div>
      <div class="stat-sub">rolling avg</div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" id="tab-btn-entry"  onclick="showTab('entry')">—</button>
    <button class="tab"        id="tab-btn-txns"   onclick="showTab('txns')">Transactions</button>
    <button class="tab"        id="tab-btn-cards"  onclick="showTab('cards')">Cards</button>
    <button class="tab"        id="tab-btn-history" onclick="showTab('history')">History</button>
    <button class="tab"        id="tab-btn-goals"  onclick="showTab('goals')">Goal</button>
  </div>

  <div id="tab-entry"></div>
  <div id="tab-txns"    style="display:none"></div>
  <div id="tab-cards"   style="display:none"></div>
  <div id="tab-history" style="display:none"></div>
  <div id="tab-goals"   style="display:none"></div>

  <div class="footer">2026 Budget Tracker · $8,084.13/mo · Auto-rolls monthly</div>
</div>

<script>
// ── Constants ──────────────────────────────────────────────────────────────────
const INCOME = 8084.13;
const WEDDING = new Date("2027-05-01");
const MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const PAYMENT_METHODS = ["Chase","Chase Sapphire","Apple Card","Amex","Debit","Cash","Other"];
const BADGE_CLASS = {"Chase":"b-Chase","Chase Sapphire":"b-ChaseSapphire","Apple Card":"b-Apple","Amex":"b-Amex","Debit":"b-Debit","Cash":"b-Cash","Other":"b-Other"};

const CATS = [
  {key:"gas",      label:"Gas",              budget:250 },
  {key:"savings",  label:"Savings",          budget:1000},
  {key:"etrade",   label:"E*Trade",          budget:300 },
  {key:"silver",   label:"Silver/Gold",      budget:250 },
  {key:"food",     label:"Going Out / Food", budget:1200},
  {key:"haircuts", label:"Haircuts",         budget:150 },
  {key:"other",    label:"Other",            budget:1550},
];

const FIXED_CATS = [
  {key:"mortgage",  label:"Mortgage",   budget:3200, aprActual:3100  },
  {key:"cell",      label:"Cell Phone", budget:166.63, aprActual:206.58},
  {key:"gym",       label:"Gym",        budget:60,   aprActual:60    },
  {key:"xbox",      label:"Xbox",       budget:23,   aprActual:39.98 },
];

const FIXED_TOTAL = FIXED_CATS.reduce((s,f)=>s+f.budget,0);

// Closed history: Jan–Mar
const CLOSED_HISTORY = [
  {label:"Jan", data:{mortgage:3100,cell:255.62,gym:60,xbox:30,gas:120.55,savings:0,  etrade:0,  silver:240, food:1194.09,haircuts:0,  other:1653.41}},
  {label:"Feb", data:{mortgage:3100,cell:208.93,gym:60,xbox:30,gas:125,   savings:575,etrade:0,  silver:250, food:1047.02,haircuts:110,other:1956.22}},
  {label:"Mar", data:{mortgage:3100,cell:208.98,gym:60,xbox:30,gas:310,   savings:250,etrade:250,silver:0,   food:1289.17,haircuts:83, other:1577.35}},
];
const APR_HISTORY = {label:"Apr", data:{mortgage:3100,cell:206.58,gym:60,xbox:39.98,gas:200,savings:250,etrade:250,silver:0,food:1468.29,haircuts:80,other:1642.63}};

// Seed data
const APR_SEED = [
  {id:1, amount:200,     payment:"Debit",      desc:"Gas",               date:"Apr 1",  catKey:"gas"     },
  {id:2, amount:250,     payment:"Debit",      desc:"Savings transfer",  date:"Apr 1",  catKey:"savings" },
  {id:3, amount:250,     payment:"Debit",      desc:"E*Trade auto",      date:"Apr 1",  catKey:"etrade"  },
  {id:4, amount:1468.29, payment:"Chase",      desc:"Food & dining",     date:"Apr 30", catKey:"food"    },
  {id:5, amount:80,      payment:"Cash",       desc:"Haircut",           date:"Apr 30", catKey:"haircuts"},
  {id:6, amount:247.19,  payment:"Chase",      desc:"Remodel supplies",  date:"Apr 30", catKey:"other"   },
  {id:7, amount:206.58,  payment:"Debit",      desc:"Cell phone bill",   date:"Apr 1",  catKey:"other"   },
  {id:8, amount:39.98,   payment:"Apple Card", desc:"Xbox subscription", date:"Apr 1",  catKey:"other"   },
  {id:9, amount:1188.88, payment:"Chase",      desc:"Other expenses",    date:"Apr 30", catKey:"other"   },
];
const MAY_SEED = [
  {id:100, amount:499, payment:"Other", desc:"Carried over expenses", date:"May 1", catKey:"other"},
];

// ── Date helpers ───────────────────────────────────────────────────────────────
function getActiveMonth() {
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  if (y === 2026 && m === 3) return {year:2026, month:3, label:"Apr 2026", isApril:true};
  return {year:y, month:m, label:`${MONTH_NAMES[m]} ${y}`, isApril:false};
}

function getMonthsUntilWedding() {
  const now = new Date();
  return Math.max(0,(WEDDING.getFullYear()-now.getFullYear())*12+(WEDDING.getMonth()-now.getMonth()));
}

function storageKey(year, month) { return `budget-txns-${year}-${month}`; }

// ── Storage ────────────────────────────────────────────────────────────────────
function loadTxns(year, month) {
  const key = storageKey(year, month);
  try {
    const raw = localStorage.getItem(key);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  // Seed defaults
  if (year===2026 && month===3) {
    const byKey = {};
    APR_SEED.forEach(t=>{ if(!byKey[t.catKey]) byKey[t.catKey]=[]; byKey[t.catKey].push(t); });
    saveTxns(year, month, byKey);
    return byKey;
  }
  if (year===2026 && month===4) {
    const byKey = {};
    MAY_SEED.forEach(t=>{ if(!byKey[t.catKey]) byKey[t.catKey]=[]; byKey[t.catKey].push(t); });
    saveTxns(year, month, byKey);
    return byKey;
  }
  return {};
}

function saveTxns(year, month, data) {
  try { localStorage.setItem(storageKey(year,month), JSON.stringify(data)); } catch(e) {}
}

// ── Global state ───────────────────────────────────────────────────────────────
const ACTIVE = getActiveMonth();
let txns = loadTxns(ACTIVE.year, ACTIVE.month);
let activeTab = "entry";
let txnFilter = "All";

function save() { saveTxns(ACTIVE.year, ACTIVE.month, txns); }

function addFixedTxn(key){
  const amt  = document.getElementById("famt-"+key)?.value;
  const pay  = document.getElementById("fpay-"+key)?.value;
  const desc = document.getElementById("fdesc-"+key)?.value;
  const errEl = document.getElementById("ferr-"+key);
  errEl.style.display="none";
  const showErr = msg => { errEl.textContent="⚠ "+msg; errEl.style.display="block"; };
  if(!amt||parseFloat(amt)<=0){ showErr("Enter an amount."); return; }
  if(!pay){ showErr("Select a payment method."); return; }
  if(!desc||!desc.trim()){ showErr("Add a short description."); return; }
  const fkey = "__fixed_"+key;
  if(!txns[fkey]) txns[fkey]=[];
  const date = new Date().toLocaleDateString("en-US",{month:"short",day:"numeric"});
  txns[fkey].push({id:Date.now(), amount:parseFloat(amt), payment:pay, desc:desc.trim(), date});
  save();
  renderEntry();
  updateStats();
}

function deleteFixedTxn(key, id){
  const fkey = "__fixed_"+key;
  if(!txns[fkey]) return;
  txns[fkey] = txns[fkey].filter(t=>t.id!==id);
  save();
  renderEntry();
  updateStats();
}

// ── Helpers ────────────────────────────────────────────────────────────────────
function fmt(n) {
  return (n<0?"-$":"$")+Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
}

function badge(method) {
  const cls = BADGE_CLASS[method]||"b-Other";
  return `<span class="badge ${cls}">${method}</span>`;
}

function progFill(value, max) {
  const pct = max>0?Math.min((value/max)*100,100):0;
  const over = value>max, warn = value>max*0.85;
  const color = over?"#f87171":warn?"#fbbf24":"#4ade80";
  return `<div class="prog-wrap"><div class="prog-fill" style="width:${pct}%;background:${color}"></div></div>`;
}

function net(t) { return t.amount - (t.reimbursed||0); }
function getCatTotal(key) { return (txns[key]||[]).reduce((s,t)=>s+net(t),0); }

function getFixedTxns(key) { return (txns["__fixed_"+key]||[]); }
function getFixedLogged(key) { return getFixedTxns(key).reduce((s,t)=>s+net(t),0); }
function getFixedTotal() {
  return FIXED_CATS.reduce((s,f)=>{
    const logged = getFixedLogged(f.key);
    if(logged>0) return s+logged;
    return s+(ACTIVE.isApril?f.aprActual:f.budget);
  },0);
}

function getTotalSpent() {
  return getFixedTotal() + CATS.reduce((s,c)=>s+getCatTotal(c.key),0);
}

function getAllTxns() {
  const varTxns = CATS.flatMap(c=>(txns[c.key]||[]).map(t=>({...t,catKey:c.key,catLabel:c.label})));
  const fixedTxns = FIXED_CATS.flatMap(f=>getFixedTxns(f.key).map(t=>({...t,catKey:"__fixed_"+f.key,catLabel:f.label+" (Fixed)"})));
  return [...varTxns,...fixedTxns].sort((a,b)=>b.id-a.id);
}

// ── Build history months ───────────────────────────────────────────────────────
function getHistoryMonths() {
  return ACTIVE.isApril
    ? [...CLOSED_HISTORY]
    : [...CLOSED_HISTORY, APR_HISTORY];
}

function getAvg(field) {
  const h = getHistoryMonths();
  return h.reduce((s,m)=>s+(m.data[field]||0),0)/h.length;
}

// ── Render cards tab ────────────────────────────────────────────────────────────
function renderCards() {
  const all = getAllTxns();
  const byMethod = {};
  all.forEach(t=>{
    if(!byMethod[t.payment]) byMethod[t.payment] = {total:0, reimbursed:0, count:0};
    byMethod[t.payment].total += t.amount;
    byMethod[t.payment].reimbursed += (t.reimbursed||0);
    byMethod[t.payment].count += 1;
  });

  const methods = Object.keys(byMethod).sort((a,b)=>byMethod[b].total-byMethod[a].total);
  const grandTotal = methods.reduce((s,m)=>s+byMethod[m].total,0);
  const grandReimb = methods.reduce((s,m)=>s+byMethod[m].reimbursed,0);

  let html = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <h2>${ACTIVE.label} by Card</h2>
      <span style="font-size:13px;color:#64748b">${methods.length} method${methods.length===1?"":"s"}</span>
    </div>`;

  if (methods.length===0) {
    html += `<div class="empty">No transactions yet.<br>Add expenses in the ${ACTIVE.label} tab, then check statement totals here.</div>`;
  } else {
    methods.forEach(m=>{
      const info = byMethod[m];
      const pct = grandTotal>0 ? (info.total/grandTotal*100) : 0;
      html += `
        <div class="card-summary">
          <div class="card-summary-top">
            <div>
              ${badge(m)}
              <span class="card-summary-sub" style="margin-left:8px">${info.count} transaction${info.count===1?"":"s"}</span>
            </div>
            <span class="card-summary-total">${fmt(info.total)}</span>
          </div>
          <div class="prog-wrap"><div class="prog-fill" style="width:${pct}%;background:#60a5fa"></div></div>
          ${info.reimbursed>0?`
          <div class="card-sub-line"><span>Reimbursed back to you</span><span style="color:#6ee7b7">-${fmt(info.reimbursed)}</span></div>
          <div class="card-sub-line"><span>Net (counted toward budget)</span><span>${fmt(info.total-info.reimbursed)}</span></div>`:""}
        </div>`;
    });

    html += `
      <div class="grand-total-box">
        <span style="color:#94a3b8;font-size:14px">Total across all cards</span>
        <span style="font-size:18px;font-weight:700;color:#f1f5f9">${fmt(grandTotal)}</span>
      </div>
      ${grandReimb>0?`
      <div style="font-size:11px;color:#6ee7b7;margin-top:6px;text-align:right">Includes ${fmt(grandReimb)} reimbursed (net: ${fmt(grandTotal-grandReimb)})</div>`:""}
      <div style="font-size:11px;color:#64748b;margin-top:10px;text-align:center">
        Compare each card's total above against its statement balance to reconcile.
      </div>`;
  }

  document.getElementById("tab-cards").innerHTML = html;
}

// ── Tab switching ──────────────────────────────────────────────────────────────
function showTab(name) {
  ["entry","txns","cards","history","goals"].forEach(t=>{
    document.getElementById("tab-"+t).style.display = t===name?"block":"none";
    document.getElementById("tab-btn-"+t).classList.toggle("active", t===name);
  });
  activeTab = name;
  if (name==="entry")   renderEntry();
  if (name==="txns")    renderTxns();
  if (name==="cards")   renderCards();
  if (name==="history") renderHistory();
  if (name==="goals")   renderGoals();
}

function setFilter(f) {
  txnFilter = f;
  renderTxns();
}

// ── Transaction actions ────────────────────────────────────────────────────────
function toggleReimbFields(key) {
  const checked = document.getElementById("reimbtoggle-"+key)?.checked;
  document.getElementById("reimbfields-"+key)?.classList.toggle("show", checked);
}

function addTxn(key) {
  const amt  = document.getElementById("amt-"+key)?.value;
  const pay  = document.getElementById("pay-"+key)?.value;
  const desc = document.getElementById("desc-"+key)?.value;
  const isReimb = document.getElementById("reimbtoggle-"+key)?.checked;
  const reimbAmt = document.getElementById("reimbamt-"+key)?.value;
  const errEl = document.getElementById("err-"+key);

  const showErr = msg => { errEl.textContent="⚠ "+msg; errEl.style.display="block"; };
  errEl.style.display="none";

  if (!amt||parseFloat(amt)<=0) { showErr("Enter an amount."); return; }
  if (!pay) { showErr("Select a payment method."); return; }
  if (!desc||!desc.trim()) { showErr("Add a short description."); return; }
  if (isReimb && (!reimbAmt||parseFloat(reimbAmt)<=0)) { showErr("Enter the amount reimbursed, or uncheck the reimbursement box."); return; }
  if (isReimb && parseFloat(reimbAmt)>parseFloat(amt)) { showErr("Reimbursed amount can't exceed the amount paid."); return; }

  if (!txns[key]) txns[key]=[];
  const date = new Date().toLocaleDateString("en-US",{month:"short",day:"numeric"});
  const entry = {id:Date.now(), amount:parseFloat(amt), payment:pay, desc:desc.trim(), date};
  if (isReimb) entry.reimbursed = parseFloat(reimbAmt);
  txns[key].push(entry);
  save();
  renderEntry();
  updateStats();
}

function deleteTxn(key, id) {
  if (!txns[key]) return;
  txns[key] = txns[key].filter(t=>t.id!==id);
  save();
  renderEntry();
  updateStats();
}

// ── Stats bar & header ─────────────────────────────────────────────────────────
function updateStats() {
  const totalBudget = FIXED_TOTAL + CATS.reduce((s,c)=>s+c.budget,0);
  const avgSav = getAvg("savings");
  const avgFd  = getAvg("food");
  document.getElementById("statBudget").textContent  = fmt(totalBudget);
  document.getElementById("statSavings").textContent = fmt(avgSav);
  document.getElementById("statSavings").style.color = avgSav<1000?"#fbbf24":"#f1f5f9";
  document.getElementById("statFood").textContent    = fmt(avgFd);
  document.getElementById("statFood").style.color    = avgFd>1200?"#fbbf24":"#f1f5f9";
  document.getElementById("weddingMonths").textContent = getMonthsUntilWedding();
  document.getElementById("tab-btn-entry").textContent = ACTIVE.label;
}

// ── Init ───────────────────────────────────────────────────────────────────────
updateStats();
showTab("entry");
</script>
